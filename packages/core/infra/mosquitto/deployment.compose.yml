services:
  server:
    image: docker.io/library/eclipse-mosquitto:2.0.22@sha256:75042dd2dd262dff9eb29c47da26d8ee57211a7bc6fc51bae55badc5fc9f6724
    command: mosquitto -c /mosquitto-no-auth.conf
    networks:
      - mosquitto
    volumes:
      - server-data:/mosquitto/data
      - server-logs:/mosquitto/log
volumes:
  server-data: null
  server-logs: null
networks:
  default:
    name: none
    external: true
  mosquitto:
    name: mosquitto
