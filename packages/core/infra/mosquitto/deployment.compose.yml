services:
  server:
    image: docker.io/library/eclipse-mosquitto:2.0.21@sha256:94f5a3d7deafa59fa3440d227ddad558f59d293c612138de841eec61bfa4d353
    command: mosquitto -c /mosquitto-no-auth.conf
    networks:
      - mosquitto
    volumes:
      - server-data:/mosquitto/data
      - server-logs:/mosquitto/log
volumes:
  server-data: null
  server-logs: null
networks:
  default:
    name: none
    external: true
  mosquitto:
    name: mosquitto
