package:
  description:
    Routing configuration to forward inbound network traffic for PlanktoScope-associated IP
    addresses
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: Apache-2.0
  sources:
    - https://github.com/PlanktoScope/pallet-standard

deployment:
  provides:
    file-exports:
      - description: Kernel parameters to enable routing between network interfaces
        target: overlays/usr/lib/sysctl.d/20-routed-ap.conf
      - description: Shell script to set up iptables rules to handle inbound network traffic on static IPs
        target: overlays/usr/libexec/forward-inbound

features:
  planktoscope-inbound-any:
    description:
      Enable the PlanktoScope to respond on any of its known static IPs (e.g. 192.168.4.1,
      192.168.5.1) on any network interface
    provides:
      file-exports:
        - description: systemd service to run the forward-inbound script during boot
          target: overlays/usr/lib/systemd/system/enable-interface-forwarding-inbound.service
        - description: systemd service enablement for enable-interface-forwarding-inbound.service
          target: overlays/etc/systemd/system/network-online.target.wants/enable-interface-forwarding-inbound.service
        - description:
            dnsmasq configuration to advertise the PlanktoScope as a route to all IP addresses
            assigned by the PlanktoScope to devices connected on all interfaces.
          target: overlays/etc/NetworkManager/dnsmasq-shared.d/35-dhcp-subnet-routes.conf
  planktoscope-dhcp-default-route:
    description:
      Configure dnsmasq's DHCP server to advertise itself as a default route to the internet
    provides:
      file-exports:
        - description: Sets DHCP settings on the wlan0, wlan1, eth0, eth1, and usb0 interfaces
          target: overlays/etc/NetworkManager/dnsmasq-shared.d/35-dhcp-default-route.conf
