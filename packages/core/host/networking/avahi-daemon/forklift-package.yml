package:
  description:
    Avahi daemon ambiently provided by the OS, and a program and system services to publish mDNS
    CNAME aliases
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: LGPL-2.1-only
  sources:
    # Ambiently-provided software (LGPL):
    - https://github.com/avahi/avahi
    # Forklift-deployed software (MIT):
    - https://github.com/grishy/go-avahi-cname
    # Systemd units (Apache-2.0):
    - https://github.com/PlanktoScope/pallet-standard

host:
  provides:
    listeners:
      - description: mDNS messaging
        port: 5353
        protocol: udp

deployment:
  provides:
    file-exports:
      - description: go-avahi-cname binary
        source-type: oci-image
        url: ghcr.io/grishy/go-avahi-cname:2.2.4
        source: go-avahi-cname
        target: overlays/usr/bin/go-avahi-cname
      - description: systemd template service to register the specified mDNS name as a CNAME alias
        target: overlays/usr/lib/systemd/system/avahi-publish-cname@.service

features:
  register-planktoscope-local:
    description: "Register `planktoscope.local` as an alias"
    provides:
      file-exports:
        - description: systemd service enablement
          target: overlays/etc/systemd/system/multi-user.target.wants/avahi-publish-cname@planktoscope.local.service
  register-pkscope-local:
    description: "Register `pkscope.local` as an alias"
    provides:
      file-exports:
        - description: systemd service enablement
          target: overlays/etc/systemd/system/multi-user.target.wants/avahi-publish-cname@pkscope.local.service
  firewall-allow-direct:
    description:
      Firewall configuration to allow mDNS traffic from directly-connected devices
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the nm-shared zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/nm-shared
    provides:
      file-exports:
        - description: Drop-in XML fragment for firewalld's mDNS service
          target: overlays/etc/firewalld/zones.d/nm-shared/41-service-mdns.xml
  firewall-allow-public:
    description:
      Firewall configuration to allow public mDNS traffic
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the public zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/public
    provides:
      file-exports:
        - description: Drop-in XML fragment for firewalld's mDNS service
          target: overlays/etc/firewalld/zones.d/public/41-service-mdns.xml
