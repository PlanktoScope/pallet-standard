package:
  description: Avahi daemon ambiently provided by the OS
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: LGPL-2.1-only
  sources:
    # Ambiently-provided software (LGPL):
    - https://github.com/avahi/avahi
    # Systemd units (Apache-2.0):
    - https://github.com/PlanktoScope/pallet-standard

host:
  provides:
    listeners:
      - description: mDNS messaging
        port: 5353
        protocol: udp
    filesets:
      - description:
          Avahi daemon client to register new mDNS/DNS-SD services or host names or address mappings
        paths:
          - /usr/bin/avahi-publish

deployment:
  provides:
    file-exports:
      - description:
          systemd template service to register the specified mDNS name as an alias for 192.168.5.1
        target: overlays/usr/lib/systemd/system/planktoscope-mdns-alias@.service

features:
  register-planktoscope-local:
    description: "Register `planktoscope.local` as an alias for 192.168.5.1"
    provides:
      file-exports:
        - description: systemd service enablement
          target: overlays/etc/systemd/system/multi-user.target.wants/planktoscope-mdns-alias@planktoscope.service
  register-pkscope-local:
    description: "Register `pkscope.local` as an alias for 192.168.5.1"
    provides:
      file-exports:
        - description: systemd service enablement
          target: overlays/etc/systemd/system/multi-user.target.wants/planktoscope-mdns-alias@pkscope.service
  firewall-allow-direct:
    description:
      Firewall configuration to allow mDNS traffic from directly-connected devices
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the nm-shared zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones/nm-shared.d
    provides:
      file-exports:
        - description: Drop-in XML fragment for firewalld's mDNS service
          target: overlays/etc/firewalld/zones/nm-shared.d/41-service-mdns.xml
  firewall-allow-public:
    description:
      Firewall configuration to allow public mDNS traffic
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the public zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones/public.d
    provides:
      file-exports:
        - description: Drop-in XML fragment for firewalld's mDNS service
          target: overlays/etc/firewalld/zones/public.d/41-service-mdns.xml
