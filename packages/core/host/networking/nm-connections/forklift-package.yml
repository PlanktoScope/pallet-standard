package:
  description: Default NetworkManager connection profiles
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: Apache-2.0
  sources:
    - https://github.com/PlanktoScope/pallet-standard

deployment:
  provides:
    file-exports:
      - description: Basic connection on eth0
        target: overlays/usr/lib/NetworkManager/system-connections/eth0-default.nmconnection
        permissions: 0600
      - description: Basic connection on eth1
        target: overlays/usr/lib/NetworkManager/system-connections/eth1-default.nmconnection
        permissions: 0600
      - description: Basic connection on usb0
        target: overlays/usr/lib/NetworkManager/system-connections/usb0-default.nmconnection
        permissions: 0600

features:
  planktoscope-eth:
    description: Basic connections on PlanktoScope-supported ethernet interfaces
    provides:
      file-exports:
        - description: Basic connection on eth0 with PlanktoScope-specific default IP address
          target: overlays/usr/lib/NetworkManager/system-connections/eth0-static.nmconnection
          permissions: 0600
        - description: Basic connection on eth1 with PlanktoScope-specific default IP address
          target: overlays/usr/lib/NetworkManager/system-connections/eth1-static.nmconnection
          permissions: 0600
  planktoscope-usb:
    description: Basic connections on PlanktoScope-supported USB tethering interfaces
    provides:
      file-exports:
        - description: Basic connection on usb0 with PlanktoScope-specific default IP address
          target: overlays/usr/lib/NetworkManager/system-connections/usb0-static.nmconnection
          permissions: 0600
  firewall-allow-direct:
    description:
      Firewall configuration to allow ICMP, DHCP, and DNS traffic from directly-connected devices
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the nm-shared zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/nm-shared
    provides:
      file-exports:
        - description: Drop-in XML fragment for firewalld's ICMP protocol
          target: overlays/etc/firewalld/zones.d/nm-shared/20-protocol-icmp.xml
        - description: Drop-in XML fragment for firewalld's DHCP services
          target: overlays/etc/firewalld/zones.d/nm-shared/30-service-dhcp.xml
        - description: Drop-in XML fragment for firewalld's DNS service
          target: overlays/etc/firewalld/zones.d/nm-shared/40-service-dns.xml
  firewall-allow-public:
    description:
      Firewall configuration to allow public ICMP, DHCP, and DNS traffic
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the public zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/public
    provides:
      file-exports:
        - description: Drop-in XML fragment for firewalld's ICMP protocol
          target: overlays/etc/firewalld/zones.d/public/20-protocol-icmp.xml
        - description: Drop-in XML fragment for firewalld's DHCP services
          target: overlays/etc/firewalld/zones.d/public/30-service-dhcp.xml
        - description: Drop-in XML fragment for firewalld's DNS service
          target: overlays/etc/firewalld/zones.d/public/40-service-dns.xml
