services:
  server:
    image: docker.io/grafana/grafana-oss:12.1.1@sha256:5749a0e982878aedaa2d320ed14d3bdce7a040a938f482258670009d419a597f
    volumes:
      - server-data:/var/lib/grafana
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - GF_PATHS_PROVISIONING=/provisioning
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
networks:
  default:
    name: none
    external: true
volumes:
  server-data: {}
