services:
  server:
    image: docker.io/amir20/dozzle:v8.12.13@sha256:2d295e45854ab2eb16277f676302ef81aced57f542a1922295edaa30a018aca1
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
networks:
  default:
    name: none
    external: true
