services:
  server:
    image: docker.io/amir20/dozzle:v8.10.7@sha256:0891fe164191875c34cb0d64cab8d6106cdd58f186df2f7e5d7e5b8be65f9f25
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
networks:
  default:
    name: none
    external: true
