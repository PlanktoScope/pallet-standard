services:
  server:
    image: docker.io/amir20/dozzle:v8.10.6@sha256:168d9530a2e63736cddd8b9795fd178579ae30a5715c4caf811ec6218cb08bab
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
networks:
  default:
    name: none
    external: true
