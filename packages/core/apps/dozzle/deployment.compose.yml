services:
  server:
    image: docker.io/amir20/dozzle:v8.13.2@sha256:ba5929460e6b0e402582875c5daa6bc9365206416ecc0b762b9162460faa5f4f
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
networks:
  default:
    name: none
    external: true
