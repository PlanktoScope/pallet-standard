services:
  server:
    image: docker.io/amir20/dozzle:v8.12.16@sha256:e970b762bdb440285ab8488051d04d997be0cca61bb0294fc58759e0296046aa
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
networks:
  default:
    name: none
    external: true
