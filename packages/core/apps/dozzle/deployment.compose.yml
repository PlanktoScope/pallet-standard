services:
  server:
    image: docker.io/amir20/dozzle:v8.12.0@sha256:6199bde8418de8eb61304941ef970407be7772ac6a0787d716a866a869a4c43c
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
networks:
  default:
    name: none
    external: true
