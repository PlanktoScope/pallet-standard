services:
  server:
    image: docker.io/amir20/dozzle:v8.12.1@sha256:9a70764bd83a4a33719b6ff812c38f54ebde41a59d3a7949d84f4c4a2b8dd0bd
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
networks:
  default:
    name: none
    external: true
