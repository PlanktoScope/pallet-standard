services:
  server:
    image: docker.io/amir20/dozzle:v8.13.3@sha256:a3915e87fbb20166edd89b977b3e795f2d0a67244ec084a13a038b44fe633c3a
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
networks:
  default:
    name: none
    external: true
