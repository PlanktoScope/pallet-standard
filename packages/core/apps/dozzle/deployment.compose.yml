services:
  server:
    image: docker.io/amir20/dozzle:v8.12.9@sha256:5e5f456cf8c8c545c80b43b833a8e83df482abb5973e022281bfa26d028f7ad3
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
networks:
  default:
    name: none
    external: true
