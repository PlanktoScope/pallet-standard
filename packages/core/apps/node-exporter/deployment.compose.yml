services:
  agent:
    image: docker.io/prom/node-exporter:v1.9.0@sha256:c99d7ee4d12a38661788f60d9eca493f08584e2e544bbd3b3fca64749f86b848
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          create_host_path: false
          propagation: rslave
    labels:
      prometheus-job: node-exporter
      prometheus-__scrape_interval__: 5s
      prometheus-__scrape_timeout__: 5s
      prometheus-__address__: host.docker.internal:9100
networks:
  default:
    name: none
    external: true
