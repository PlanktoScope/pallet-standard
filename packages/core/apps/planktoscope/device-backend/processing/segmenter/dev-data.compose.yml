services:
  server:
    volumes:
      - ~/.local/share/planktoscope/data:/home/pi/data
    depends_on:
      data-bind-mount-setup:
        condition: service_completed_successfully
  data-bind-mount-setup:
    image: docker.io/library/alpine:3.21.3@sha256:a8560b36e8b8210634f77d9f7f9efd7ffa463e380b75e2e74aff4511df3ef88c
    volumes:
      - ~/.local/share/planktoscope/data:/home/pi/data
    command: 'sh -c "chown -R 1000:1000 /home/pi/data; sleep 60"'
