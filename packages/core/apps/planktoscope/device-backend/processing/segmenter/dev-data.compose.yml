services:
  server:
    volumes:
      - ~/.local/share/planktoscope/data:/home/pi/data
    depends_on:
      data-bind-mount-setup:
        condition: service_completed_successfully
  data-bind-mount-setup:
    image: docker.io/library/alpine:3.22.0@sha256:8a1f59ffb675680d47db6337b49d22281a139e9d709335b492be023728e11715
    volumes:
      - ~/.local/share/planktoscope/data:/home/pi/data
    command: 'sh -c "chown -R 1000:1000 /home/pi/data; sleep 60"'
