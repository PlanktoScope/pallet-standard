services:
  server:
    volumes:
      - ~/.local/share/planktoscope/data:/home/pi/data
    depends_on:
      data-bind-mount-setup:
        condition: service_completed_successfully
  data-bind-mount-setup:
    image: docker.io/library/alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    volumes:
      - ~/.local/share/planktoscope/data:/home/pi/data
    command: 'sh -c "chown -R 1000:1000 /home/pi/data; sleep 60"'
