services:
  server:
    volumes:
      - /run/machine-name:/run/machine-name
      - /home/pi/data:/home/pi/data
      - /home/pi/device-backend-logs:/home/pi/device-backend-logs
    depends_on:
      bind-mount-setup:
        condition: service_completed_successfully
  bind-mount-setup:
    # This is a workaround for non-rootless Docker creating bind mounts with root ownership:
    image: docker.io/library/alpine:3.22.0@sha256:8a1f59ffb675680d47db6337b49d22281a139e9d709335b492be023728e11715
    volumes:
      - /home/pi/data:/home/pi/data
      - /home/pi/device-backend-logs:/home/pi/device-backend-logs
    command: 'sh -c "chown -R 1000:1000 /home/pi/data /home/pi/device-backend-logs; sleep 60"'
