services:
  server:
    image: docker.io/filebrowser/filebrowser:v2.42.1@sha256:875d770714b8bb536307394c667f9480ae773e6fb1bcb990baadbc49032a08ed
    volumes:
      - /home/pi/data:/home/pi/data
      - /home/pi/data:/srv # this prevents filebrowser from making an unnamed volume
      - server-data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/home/pi/data
      # We must assign a port which is available to non-root users:
      - FB_PORT=9000
    user: '1000:1000'
    depends_on:
      volume-setup:
        condition: service_completed_successfully
  volume-setup:
    image: docker.io/library/alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    volumes:
      - server-data:/database
      - /home/pi/data:/home/pi/data
    command: 'sh -c "chown -R 1000:1000 /database /home/pi/data; sleep 60"'
networks:
  default:
    name: none
    external: true
volumes:
  server-data: {}
