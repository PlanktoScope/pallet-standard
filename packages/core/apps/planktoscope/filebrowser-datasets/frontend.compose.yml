services:
  server:
    networks:
      - caddy-ingress
    environment:
      - FB_BASEURL=/ps/data/browse
      - FB_NOAUTH=true
    labels:
      caddy: :80
      caddy.redir: /ps/data/browse /ps/data/browse/
      caddy.handle: /ps/data/browse/*
      caddy.handle.reverse_proxy: "{{upstreams 9000}}"
  volume-setup:
    networks:
      # This is needed so Docker doesn't complain
      - caddy-ingress

networks:
  caddy-ingress:
    external: true
