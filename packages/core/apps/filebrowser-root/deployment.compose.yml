services:
  server:
    image: docker.io/filebrowser/filebrowser:v2.33.8@sha256:b31708528d91e54d5a8f2e1778e8e752966bea787e596eaea191de874fa832ea
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /srv # this prevents filebrowser from making an unnamed volume
        bind:
          create_host_path: false
      - server-data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/root
networks:
  default:
    name: none
    external: true
volumes:
  server-data: {}
