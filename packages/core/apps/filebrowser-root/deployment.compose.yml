services:
  server:
    image: docker.io/filebrowser/filebrowser:v2.33.7@sha256:e0969d7619096d704f1df790a80b9e00ee5240aedb401f87f104b70530cb7dca
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /srv # this prevents filebrowser from making an unnamed volume
        bind:
          create_host_path: false
      - server-data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/root
networks:
  default:
    name: none
    external: true
volumes:
  server-data: {}
