services:
  server:
    image: docker.io/filebrowser/filebrowser:v2.42.1@sha256:875d770714b8bb536307394c667f9480ae773e6fb1bcb990baadbc49032a08ed
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /srv # this prevents filebrowser from making an unnamed volume
        bind:
          create_host_path: false
      - server-data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/root
networks:
  default:
    name: none
    external: true
volumes:
  server-data: {}
