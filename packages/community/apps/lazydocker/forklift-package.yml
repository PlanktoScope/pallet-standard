package:
  description: TUI for inspecting and troubleshooting Docker containers
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: MIT
  sources:
    - https://github.com/jesseduffield/lazydocker

features:
  amd64:
    description: lazydocker for AMD64 (x86-64) systems
    provides:
      file-exports:
        - description: lazydocker binary
          source-type: http-archive
          url: https://github.com/jesseduffield/lazydocker/releases/download/v0.24.1/lazydocker_0.24.1_Linux_x86_64.tar.gz
          source: lazydocker
          target: overlays/usr/bin/lazydocker
  arm64:
    description: lazydocker for ARM64 systems
    provides:
      file-exports:
        - description: lazydocker binary
          source-type: http-archive
          url: https://github.com/jesseduffield/lazydocker/releases/download/v0.24.1/lazydocker_0.24.1_Linux_arm64.tar.gz
          source: lazydocker
          target: overlays/usr/bin/lazydocker
  armv7:
    description: lazydocker for ARMv7 systems
    provides:
      file-exports:
        - description: lazydocker binary
          source-type: http-archive
          url: https://github.com/jesseduffield/lazydocker/releases/download/v0.24.1/lazydocker_0.24.1_Linux_armv7.tar.gz
          source: lazydocker
          target: overlays/usr/bin/lazydocker

