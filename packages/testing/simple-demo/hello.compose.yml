services:
  hello:
    image: nginxdemos/hello:0.4@sha256:eee573ca9c6299f621b27628d341ac61cce3f68991327601c3355ccbc4ec8a09
    networks:
      - caddy-ingress
    labels:
      caddy: :80
      caddy.redir: /demo/hello-nginx /demo/hello-nginx/
      caddy.handle_path: /demo/hello-nginx/*
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
networks:
  caddy-ingress:
    external: true
