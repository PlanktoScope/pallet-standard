services:
  hello:
    image: nginxdemos/hello:0.4@sha256:ac5c9e41b5136a60a959d490cb7dd786f32642719b8003e5a4946a37d5fde7e3
    networks:
      - caddy-ingress
    labels:
      caddy: :80
      caddy.redir: /demo/hello-nginx /demo/hello-nginx/
      caddy.handle_path: /demo/hello-nginx/*
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
networks:
  caddy-ingress:
    external: true
