services:
  hello:
    image: nginxdemos/hello:0.4@sha256:2293656951429d36b788d1285a97bd2a862428759802444450257760790423f6
    networks:
      - caddy-ingress
    labels:
      caddy: :80
      caddy.redir: /demo/hello-nginx /demo/hello-nginx/
      caddy.handle_path: /demo/hello-nginx/*
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
networks:
  caddy-ingress:
    external: true
