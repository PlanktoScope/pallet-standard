services:
  hello:
    image: nginxdemos/hello:0.4@sha256:44f4273c46f4344c8d8c3dbcc5de49c19df97be452363e45e4c1ee7ae98a1ea9
    networks:
      - caddy-ingress
    labels:
      caddy: :80
      caddy.redir: /demo/hello-nginx /demo/hello-nginx/
      caddy.handle_path: /demo/hello-nginx/*
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
networks:
  caddy-ingress:
    external: true
