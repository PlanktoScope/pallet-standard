services:
  hello:
    image: nginxdemos/hello:0.4@sha256:383dd0653b73036ff16013608dc7962805fd27ee5b1fe3f3a63467603872e1ca
    networks:
      - caddy-ingress
    labels:
      caddy: :80
      caddy.redir: /demo/hello-nginx /demo/hello-nginx/
      caddy.handle_path: /demo/hello-nginx/*
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
networks:
  caddy-ingress:
    external: true
