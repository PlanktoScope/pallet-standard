services:
  hello:
    image: nginxdemos/hello:0.4@sha256:23ef1e10fc7b638f4c05ec20bc245f04fd48f514f1a3b27390a60da603008559
    networks:
      - caddy-ingress
    labels:
      caddy: :80
      caddy.redir: /demo/hello-nginx /demo/hello-nginx/
      caddy.handle_path: /demo/hello-nginx/*
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
networks:
  caddy-ingress:
    external: true
