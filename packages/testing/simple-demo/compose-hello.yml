services:
  hello:
    image: nginxdemos/hello:0.4@sha256:a87891c3daa5bd5436c9a652897e78de2fec10ee04e780dfb61b8e1137cd4d61
    networks:
      - caddy-ingress
    labels:
      caddy: :80
      caddy.redir: /demo/hello-nginx /demo/hello-nginx/
      caddy.handle_path: /demo/hello-nginx/*
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
networks:
  caddy-ingress:
    external: true
